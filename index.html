<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <div class="topbar">


        <div class="search-box">
            <input type="text" placeholder="Search song, artists, albums or podcast">
            <span class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i> 
            </span>
        </div>

        <div class="icon-button"></div>

        <div class="avatar"></div>

    </div>


    <div class="sidebar">

        <h1>🎵 Music</h1>

        <ul>
            <li>Home</li>
            <li>Explore</li>
            <li>Library</li>
            <li>Podcasts</li>
        </ul>
        <div class="activity-section">
            <h2>YOUR ACTIVITY</h2>
            <div class="" activity-box>
                <ul>
                    <li>Likes</li>
                    <li>Comments</li>
                </ul>
            </div>
        </div>


        <div class="playlist-section">
            <h2 class="playlist-title">Playlist</h2>

            <div class="playlist-box active">
                <p class="playlist-title">High Distortion</p>
                <p class="playlist-info">45 songs · 95 mins</p>
            </div>

            <div class="playlist-box">
                <p class="playlist-title">Easy Breezy Beats</p>
                <p class="playlist-info">23 songs · 40 mins</p>
            </div>

            <div class="playlist-box">
                <p class="playlist-title">Mellow Moments</p>
                <p class="playlist-info">45 songs · 95 mins</p>
            </div>

            <div class="playlist-box">
                <p class="playlist-title">Laid-Back Grooves</p>
                <p class="playlist-info">45 songs · 95 mins</p>
            </div>

            <div class="playlist-box">
                <p class="playlist-title">Sunset Song</p>
                <p class="playlist-info">23 songs · 40 mins</p>
            </div>
        </div>

        <button>+ New Playlist</button>

    </div>

</body>

</html>
